name: Release

# Pushing a v* tag validates CHANGELOG.md, extracts that version's section as
# the release notes, and creates the GitHub release from it — a tag with no
# matching changelog entry fails rather than shipping an empty/wrong release.
# Creating the release fires publish.yml's `release: published` trigger.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate changelog
        uses: ConfiguredThings/validate-changelog-action@v4

      - name: Extract changelog section for this tag
        id: changelog
        uses: ConfiguredThings/validate-changelog-action/extract@v4
        with:
          version: ${{ github.ref_name }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "$NOTES"
