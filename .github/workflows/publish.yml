name: Publish to npm

# The `release: published` trigger is deliberately not enabled yet. This package has never been
# published, and npm Trusted Publishing is configured on an *existing* package's Settings page —
# there's nothing to attach it to until a first `npm publish` happens manually. Publish v0.1.0
# by hand (with your own 2FA), configure the Trusted Publisher on npmjs.com the same way as
# vallox.js, then add the `release: types: [published]` trigger back for v0.1.1 onward.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Trusted Publishing requires npm CLI >= 11.5.1; pin explicitly so a
      # runner with an older bundled npm doesn't silently fall back/fail.
      - name: Ensure npm >= 11.5.1
        run: npm install -g npm@latest

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance
